<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">SAG2 通过证据逐步发现多跳关系</title>
  <desc id="desc">示例展示从 A 公司收购 B 公司，到 A 公司 CTO 张三，再到张三加入大模型项目的证据链。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61717d"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1d2a35" flood-opacity="0.08"/></filter></defs>
  <rect width="1200" height="580" fill="#f8f7f2"/>
  <text x="60" y="52" fill="#1d2a35" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700">多跳问题：让证据带出下一轮关键词</text>
  <text x="60" y="82" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17">每一段新证据都可能改变下一轮检索，而不是一次召回后把所有关联交给大模型猜。</text>
  <rect x="60" y="116" width="1080" height="76" rx="18" fill="#e8f2ee" stroke="#b8d7cb" stroke-width="2"/>
  <text x="88" y="148" fill="#347563" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700">用户问题</text>
  <text x="88" y="176" fill="#1d2a35" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21">收购了 B 公司的企业，其 CTO 后来加入了哪个项目？</text>
  <g filter="url(#shadow)" font-family="Arial, 'Microsoft YaHei', sans-serif">
    <rect x="75" y="250" width="300" height="160" rx="18" fill="#fff" stroke="#e4c7b5" stroke-width="2"/><circle cx="112" cy="286" r="21" fill="#d77a48"/><text x="112" y="293" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">1</text><text x="150" y="292" fill="#9a4d2c" font-size="18" font-weight="700">初始证据</text><text x="100" y="335" fill="#1d2a35" font-size="20">A 公司收购了</text><text x="100" y="365" fill="#1d2a35" font-size="20">B 公司。</text><rect x="100" y="382" width="158" height="22" rx="11" fill="#fff0e7"/><text x="179" y="399" text-anchor="middle" fill="#9a4d2c" font-size="13">关键词：A 公司、CTO</text>
    <rect x="450" y="250" width="300" height="160" rx="18" fill="#fff" stroke="#b9cfe1" stroke-width="2"/><circle cx="487" cy="286" r="21" fill="#5d87ad"/><text x="487" y="293" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">2</text><text x="525" y="292" fill="#416b91" font-size="18" font-weight="700">关系证据</text><text x="475" y="335" fill="#1d2a35" font-size="20">张三是 A 公司</text><text x="475" y="365" fill="#1d2a35" font-size="20">的 CTO。</text><rect x="475" y="382" width="158" height="22" rx="11" fill="#eaf2fa"/><text x="554" y="399" text-anchor="middle" fill="#416b91" font-size="13">关键词：张三</text>
    <rect x="825" y="250" width="300" height="160" rx="18" fill="#fff" stroke="#b8d7cb" stroke-width="2"/><circle cx="862" cy="286" r="21" fill="#5f9f8a"/><text x="862" y="293" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">3</text><text x="900" y="292" fill="#347563" font-size="18" font-weight="700">最终证据</text><text x="850" y="335" fill="#1d2a35" font-size="20">张三后来加入了</text><text x="850" y="365" fill="#1d2a35" font-size="20">盘古大模型项目。</text><rect x="850" y="382" width="158" height="22" rx="11" fill="#e8f5ef"/><text x="929" y="399" text-anchor="middle" fill="#347563" font-size="13">答案：盘古项目</text>
  </g>
  <path d="M375 330 H440" stroke="#61717d" stroke-width="3" marker-end="url(#arrow)"/><path d="M750 330 H815" stroke="#61717d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="407" y="312" text-anchor="middle" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">带出新词</text><text x="782" y="312" text-anchor="middle" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">带出新词</text>
  <rect x="160" y="465" width="880" height="62" rx="16" fill="#fff" stroke="#d8dedf"/>
  <text x="600" y="491" text-anchor="middle" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">证据链</text><text x="600" y="515" text-anchor="middle" fill="#1d2a35" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700">B 公司 → A 公司 → CTO → 张三 → 盘古大模型项目</text>
</svg>
