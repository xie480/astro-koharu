<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">未来 RAG 根据问题复杂度动态选择检索路径</title>
  <desc id="desc">系统先判断问题复杂度，再在关键词、混合检索、SAG2 多跳检索和图谱或层级摘要之间动态路由，最后统一进入上下文与回答。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61717d"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1d2a35" flood-opacity="0.08"/></filter></defs>
  <rect width="1200" height="680" fill="#f8f7f2"/>
  <text x="60" y="54" fill="#1d2a35" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700">未来 RAG：轻量底座，按需升级</text>
  <text x="60" y="84" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17">系统不必让所有问题都走最重的链路，而是根据问题复杂度动态分配计算。</text>
  <g filter="url(#shadow)" font-family="Arial, 'Microsoft YaHei', sans-serif"><rect x="70" y="280" width="180" height="88" rx="18" fill="#e8f2ee" stroke="#b8d7cb" stroke-width="2"/><text x="160" y="318" text-anchor="middle" fill="#347563" font-size="20" font-weight="700">用户问题</text><text x="160" y="345" text-anchor="middle" fill="#61717d" font-size="15">先判断复杂度</text></g>
  <path d="M250 324 H315" stroke="#61717d" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)" font-family="Arial, 'Microsoft YaHei', sans-serif"><rect x="325" y="260" width="190" height="130" rx="18" fill="#fff" stroke="#d8dedf" stroke-width="2"/><text x="420" y="302" text-anchor="middle" fill="#1d2a35" font-size="20" font-weight="700">问题路由器</text><text x="420" y="335" text-anchor="middle" fill="#61717d" font-size="15">词法？语义？</text><text x="420" y="360" text-anchor="middle" fill="#61717d" font-size="15">多跳？全局？</text></g>
  <path d="M515 280 C560 220 585 170 650 150" fill="none" stroke="#91c2ad" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M515 315 H650" fill="none" stroke="#8eacc8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M515 345 C560 390 585 430 650 460" fill="none" stroke="#d6a98d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M515 372 C565 510 590 555 650 565" fill="none" stroke="#b7a8d1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)" font-family="Arial, 'Microsoft YaHei', sans-serif"><rect x="660" y="105" width="310" height="82" rx="17" fill="#f2fbf7" stroke="#b8d7cb" stroke-width="2"/><text x="815" y="138" text-anchor="middle" fill="#347563" font-size="19" font-weight="700">关键词快速路径</text><text x="815" y="165" text-anchor="middle" fill="#61717d" font-size="15">BM25 → 少量上下文 → 回答</text><rect x="660" y="220" width="310" height="82" rx="17" fill="#f3f7fc" stroke="#b9cfe1" stroke-width="2"/><text x="815" y="253" text-anchor="middle" fill="#416b91" font-size="19" font-weight="700">语义混合路径</text><text x="815" y="280" text-anchor="middle" fill="#61717d" font-size="15">BM25 + Dense + Rerank</text><rect x="660" y="335" width="310" height="82" rx="17" fill="#fff7f1" stroke="#e4c7b5" stroke-width="2"/><text x="815" y="368" text-anchor="middle" fill="#9a4d2c" font-size="19" font-weight="700">SAG2 多跳路径</text><text x="815" y="395" text-anchor="middle" fill="#61717d" font-size="15">证据判断 → 新关键词 → 继续检索</text><rect x="660" y="450" width="310" height="82" rx="17" fill="#f5f1fb" stroke="#c7bfdf" stroke-width="2"/><text x="815" y="483" text-anchor="middle" fill="#6d5a90" font-size="19" font-weight="700">全局理解路径</text><text x="815" y="510" text-anchor="middle" fill="#61717d" font-size="15">GraphRAG / RAPTOR / 摘要层级</text></g>
  <path d="M970 146 H1015" stroke="#61717d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M970 261 H1015" stroke="#61717d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M970 376 H1015" stroke="#61717d" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M970 491 H1015" stroke="#61717d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)" font-family="Arial, 'Microsoft YaHei', sans-serif"><rect x="1025" y="260" width="130" height="130" rx="18" fill="#1d2a35"/><text x="1090" y="310" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">上下文</text><text x="1090" y="340" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">与回答</text><text x="1090" y="366" text-anchor="middle" fill="#b9c8d0" font-size="14">统一出口</text></g>
  <rect x="175" y="570" width="850" height="46" rx="23" fill="#fff" stroke="#d8dedf"/><text x="600" y="599" text-anchor="middle" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">架构的关键不在于“永远轻”或“永远重”，而在于知道什么时候该升级。</text>
</svg>
