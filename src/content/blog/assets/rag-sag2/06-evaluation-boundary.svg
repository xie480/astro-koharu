<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">论文指标与生产结论之间需要保留实验边界</title>
  <desc id="desc">左侧列出 SAG2 论文报告的索引和 Recall@10 结果，右侧列出把实验结果写成生产结论时必须补充的条件。</desc>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1d2a35" flood-opacity="0.08"/></filter></defs>
  <rect width="1200" height="620" fill="#f8f7f2"/>
  <text x="60" y="54" fill="#1d2a35" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700">看 benchmark：数字要和条件一起出现</text>
  <text x="60" y="84" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17">实验结果可以支持方向判断，但不能脱离数据规模、基线和指标口径变成普遍承诺。</text>
  <rect x="60" y="125" width="500" height="390" rx="22" fill="#fff" stroke="#b8d7cb" stroke-width="2" filter="url(#shadow)"/><rect x="640" y="125" width="500" height="390" rx="22" fill="#fff" stroke="#e4c7b5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="90" y="151" width="170" height="34" rx="17" fill="#dcefe8"/><text x="175" y="174" text-anchor="middle" fill="#347563" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700">论文报告</text><rect x="670" y="151" width="190" height="34" rx="17" fill="#f6e2d7"/><text x="765" y="174" text-anchor="middle" fill="#9a4d2c" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700">写作时补充边界</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif"><text x="92" y="230" fill="#1d2a35" font-size="22" font-weight="700">11,656 个段落</text><text x="92" y="258" fill="#61717d" font-size="16">MuSiQue 索引实验</text><text x="92" y="315" fill="#1d2a35" font-size="22" font-weight="700">2.36 秒</text><text x="92" y="343" fill="#61717d" font-size="16">索引时间；约 25.87 MiB 数据库</text><text x="92" y="400" fill="#1d2a35" font-size="22" font-weight="700">Recall@10</text><text x="92" y="428" fill="#61717d" font-size="16">MuSiQue 86.62% · 2Wiki 97.43%</text><text x="92" y="456" fill="#61717d" font-size="16">HotpotQA 99.00%</text></g>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#1d2a35"><text x="672" y="230">① 数据集与数据规模</text><text x="672" y="280">② 硬件、模型和实现版本</text><text x="672" y="330">③ 对比基线与计算预算</text><text x="672" y="380">④ 指标是召回率、索引速度，还是回答质量</text><text x="672" y="430">⑤ 是否覆盖真实企业文档与高并发场景</text></g>
  <path d="M560 320 H640" stroke="#61717d" stroke-width="3"/><text x="600" y="303" text-anchor="middle" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">不要跳过</text><text x="600" y="343" text-anchor="middle" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">实验条件</text>
  <rect x="180" y="550" width="840" height="42" rx="21" fill="#fff0e7"/><text x="600" y="577" text-anchor="middle" fill="#9a4d2c" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700">正确表述：在论文条件下表现突出 ≠ 所有生产环境都更快更准</text>
</svg>
