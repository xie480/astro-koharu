<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">可靠助手与具体角色的优化方向</title>
  <desc id="desc">对照图：可靠助手追求快速、清楚、礼貌、可控和任务完成；具体角色需要保留偏好、拒绝、误解和未完成关系，两条方向都合理，但优化重点不同。</desc>
  <style>
    :root {
      --bg: #fcfbf8;
      --ink: #1d2a35;
      --muted: #61717d;
      --line: #d7dee2;
      --assistant: #347563;
      --assistant-fill: #e5f2ed;
      --character: #6b5a9e;
      --character-fill: #eee9f8;
      --note: #9a4d2c;
      --note-fill: #f8e9df;
    }
    text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: var(--ink); }
    .muted { fill: var(--muted); }
    .arrow { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="fork-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <rect width="960" height="600" rx="20" fill="var(--bg)"/>
  <text x="52" y="58" font-size="30" font-weight="700">同一个模型，可以被推向两种不同的目标</text>
  <text x="52" y="90" class="muted" font-size="17">左侧更容易被产品指标奖励，右侧更需要作者主动保留摩擦。</text>

  <rect x="330" y="124" width="300" height="62" rx="31" fill="#ffffff" stroke="var(--line)" stroke-width="2"/>
  <text x="480" y="162" text-anchor="middle" font-size="19" font-weight="700">通用模型：理解、生成、规划</text>
  <path d="M480 186 V224 M480 224 L248 274 M480 224 L712 274" class="arrow" stroke="var(--muted)" marker-end="url(#fork-arrow)"/>

  <rect x="52" y="246" width="392" height="270" rx="18" fill="#ffffff" stroke="var(--assistant)" stroke-width="2"/>
  <rect x="514" y="246" width="394" height="270" rx="18" fill="#ffffff" stroke="var(--character)" stroke-width="2"/>
  <text x="82" y="288" fill="var(--assistant)" font-size="22" font-weight="700">可靠助手</text>
  <text x="544" y="288" fill="var(--character)" font-size="22" font-weight="700">具体角色</text>

  <g font-size="17">
    <rect x="82" y="310" width="332" height="36" rx="9" fill="var(--assistant-fill)"/>
    <text x="100" y="334">快速响应，表达清楚</text>
    <rect x="82" y="355" width="332" height="36" rx="9" fill="var(--assistant-fill)"/>
    <text x="100" y="379">礼貌、稳定、尽量可控</text>
    <rect x="82" y="400" width="332" height="36" rx="9" fill="var(--assistant-fill)"/>
    <text x="100" y="424">主动补全上下文</text>
    <rect x="82" y="445" width="332" height="36" rx="9" fill="var(--assistant-fill)"/>
    <text x="100" y="469">尽快完成用户任务</text>
  </g>
  <text x="248" y="502" text-anchor="middle" fill="var(--assistant)" font-size="16" font-weight="700">可接受性 ↑　冲突 ↓</text>

  <g font-size="17">
    <rect x="544" y="310" width="334" height="36" rx="9" fill="var(--character-fill)"/>
    <text x="562" y="334">保留偏好和私人优先级</text>
    <rect x="544" y="355" width="334" height="36" rx="9" fill="var(--character-fill)"/>
    <text x="562" y="379">允许拒绝，不总是配合</text>
    <rect x="544" y="400" width="334" height="36" rx="9" fill="var(--character-fill)"/>
    <text x="562" y="424">保留误解、隐瞒和迟疑</text>
    <rect x="544" y="445" width="334" height="36" rx="9" fill="var(--character-fill)"/>
    <text x="562" y="469">让关系暂时保持未完成</text>
  </g>
  <text x="711" y="502" text-anchor="middle" fill="var(--character)" font-size="16" font-weight="700">具体性 ↑　阻力 ↑</text>

  <rect x="220" y="542" width="520" height="36" rx="18" fill="var(--note-fill)" stroke="var(--note)" stroke-width="1.5"/>
  <text x="480" y="566" text-anchor="middle" fill="var(--note)" font-size="15" font-weight="700">产品优化倾向于“更好用”，角色设计还要允许“更难相处”</text>
</svg>
