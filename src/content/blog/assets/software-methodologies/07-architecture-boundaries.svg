<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Clean Architecture 与 Hexagonal Architecture 的边界对照</title>
  <desc id="desc">左侧用同心层次展示 Clean Architecture 的依赖方向，右侧用核心、端口和适配器展示 Hexagonal Architecture 的外部交互边界。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #1d2a35; }
    .muted { fill: #61717d; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 17px; }
    .head { font-size: 23px; font-weight: 700; }
    .label { font-size: 16px; }
    .small { font-size: 14px; }
  </style>
  <rect width="1200" height="700" fill="#f8f7f2"/>
  <text x="60" y="56" class="title">两种架构表达不同，但都在保护业务核心</text>
  <text x="60" y="88" class="subtitle muted">Clean Architecture 强调依赖方向，Hexagonal Architecture 强调端口与适配器。</text>

  <rect x="60" y="132" width="500" height="430" rx="22" fill="#ffffff" stroke="#b9cfe6" stroke-width="2"/>
  <rect x="640" y="132" width="500" height="430" rx="22" fill="#ffffff" stroke="#b8d7cb" stroke-width="2"/>

  <text x="96" y="180" class="head" fill="#35658f">Clean Architecture</text>
  <text x="96" y="208" class="label muted">依赖方向向内</text>
  <circle cx="310" cy="370" r="148" fill="#eef3fa" stroke="#b9cfe6" stroke-width="2"/>
  <circle cx="310" cy="370" r="106" fill="#e0ebf8" stroke="#7ca6cf" stroke-width="2"/>
  <circle cx="310" cy="370" r="64" fill="#dcefe8" stroke="#7db7a5" stroke-width="2"/>
  <text x="310" y="366" text-anchor="middle" class="label" fill="#347563">实体与业务规则</text>
  <text x="310" y="390" text-anchor="middle" class="small">用例</text>
  <text x="310" y="260" text-anchor="middle" class="small muted">接口适配层</text>
  <text x="310" y="505" text-anchor="middle" class="small muted">框架、数据库、Web 与外部设备</text>
  <path d="M486 278 C520 320 520 420 486 462" fill="none" stroke="#35658f" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="470" y="370" text-anchor="middle" class="small" fill="#35658f" transform="rotate(90 470 370)">依赖指向核心</text>

  <text x="676" y="180" class="head" fill="#347563">Hexagonal Architecture</text>
  <text x="676" y="208" class="label muted">核心通过端口连接外部适配器</text>
  <polygon points="890,250 1010,320 1010,450 890,520 770,450 770,320" fill="#f2fbf7" stroke="#b8d7cb" stroke-width="2"/>
  <circle cx="890" cy="385" r="66" fill="#dcefe8" stroke="#7db7a5" stroke-width="2"/>
  <text x="890" y="379" text-anchor="middle" class="label" fill="#347563">核心业务</text>
  <text x="890" y="403" text-anchor="middle" class="small">应用与领域</text>
  <rect x="734" y="294" width="104" height="36" rx="18" fill="#e0ebf8"/><text x="786" y="317" text-anchor="middle" class="small">输入端口</text>
  <rect x="942" y="294" width="104" height="36" rx="18" fill="#e0ebf8"/><text x="994" y="317" text-anchor="middle" class="small">输出端口</text>
  <rect x="704" y="470" width="128" height="36" rx="18" fill="#fff7f1"/><text x="768" y="493" text-anchor="middle" class="small">HTTP 适配器</text>
  <rect x="948" y="470" width="128" height="36" rx="18" fill="#fff7f1"/><text x="1012" y="493" text-anchor="middle" class="small">数据库适配器</text>
  <path d="M838 312 L824 320" stroke="#61717d" stroke-width="2"/>
  <path d="M942 312 L956 320" stroke="#61717d" stroke-width="2"/>
  <path d="M824 450 L798 470" stroke="#61717d" stroke-width="2"/>
  <path d="M956 450 L982 470" stroke="#61717d" stroke-width="2"/>

  <rect x="270" y="604" width="660" height="46" rx="23" fill="#f6e2d7"/>
  <text x="600" y="633" text-anchor="middle" class="label" fill="#9a4d2c">共同目标：让业务规则少依赖外部技术，变化被隔离在边界之外</text>
</svg>