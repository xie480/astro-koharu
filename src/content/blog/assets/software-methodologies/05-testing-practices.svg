<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">TDD、BDD、ATDD 与 Specification by Example 的关注层级</title>
  <desc id="desc">图表对比四种测试和规范方法的主要参与者、关注对象和主要产物，说明它们都在提前反馈，但关注层级不同。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #1d2a35; }
    .muted { fill: #61717d; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 17px; }
    .head { font-size: 17px; font-weight: 700; }
    .label { font-size: 16px; }
    .small { font-size: 14px; }
  </style>
  <rect width="1200" height="720" fill="#f8f7f2"/>
  <text x="60" y="56" class="title">四种测试与规范方法，都在提前反馈，但关注对象不同</text>
  <text x="60" y="88" class="subtitle muted">不要把它们写成简单的升级关系，更适合按照反馈层级来理解。</text>

  <rect x="60" y="132" width="1080" height="430" rx="20" fill="#ffffff" stroke="#d7dee2" stroke-width="2"/>
  <rect x="60" y="132" width="1080" height="62" rx="20" fill="#eef3fa"/>
  <rect x="60" y="174" width="1080" height="20" fill="#eef3fa"/>
  <line x1="300" y1="132" x2="300" y2="562" stroke="#d7dee2" stroke-width="2"/>
  <line x1="570" y1="132" x2="570" y2="562" stroke="#d7dee2" stroke-width="2"/>
  <line x1="840" y1="132" x2="840" y2="562" stroke="#d7dee2" stroke-width="2"/>
  <line x1="60" y1="194" x2="1140" y2="194" stroke="#d7dee2" stroke-width="2"/>
  <line x1="60" y1="286" x2="1140" y2="286" stroke="#d7dee2" stroke-width="2"/>
  <line x1="60" y1="378" x2="1140" y2="378" stroke="#d7dee2" stroke-width="2"/>
  <line x1="60" y1="470" x2="1140" y2="470" stroke="#d7dee2" stroke-width="2"/>

  <text x="180" y="170" text-anchor="middle" class="head">方法</text>
  <text x="435" y="170" text-anchor="middle" class="head">主要参与者</text>
  <text x="705" y="170" text-anchor="middle" class="head">关注对象</text>
  <text x="990" y="170" text-anchor="middle" class="head">主要产物</text>

  <rect x="82" y="212" width="196" height="48" rx="12" fill="#eadff5"/>
  <text x="180" y="242" text-anchor="middle" class="label" fill="#76529a">Specification by Example</text>
  <text x="435" y="242" text-anchor="middle" class="label">业务、开发、测试</text>
  <text x="705" y="242" text-anchor="middle" class="label">业务规则</text>
  <text x="990" y="242" text-anchor="middle" class="label">具体示例</text>

  <rect x="82" y="304" width="196" height="48" rx="12" fill="#fff7f1"/>
  <text x="180" y="334" text-anchor="middle" class="label" fill="#9a4d2c">BDD</text>
  <text x="435" y="334" text-anchor="middle" class="label">业务、开发、测试</text>
  <text x="705" y="334" text-anchor="middle" class="label">系统行为</text>
  <text x="990" y="334" text-anchor="middle" class="label">行为场景</text>

  <rect x="82" y="396" width="196" height="48" rx="12" fill="#e0ebf8"/>
  <text x="180" y="426" text-anchor="middle" class="label" fill="#35658f">ATDD</text>
  <text x="435" y="426" text-anchor="middle" class="label">业务、开发、测试</text>
  <text x="705" y="426" text-anchor="middle" class="label">验收目标</text>
  <text x="990" y="426" text-anchor="middle" class="label">验收测试</text>

  <rect x="82" y="488" width="196" height="48" rx="12" fill="#dcefe8"/>
  <text x="180" y="518" text-anchor="middle" class="label" fill="#347563">TDD</text>
  <text x="435" y="518" text-anchor="middle" class="label">开发者</text>
  <text x="705" y="518" text-anchor="middle" class="label">代码行为</text>
  <text x="990" y="518" text-anchor="middle" class="label">单元测试</text>

  <rect x="270" y="604" width="660" height="54" rx="27" fill="#f6e2d7"/>
  <text x="600" y="638" text-anchor="middle" class="label" fill="#9a4d2c">共同目标：把模糊期待提前变成可讨论、可验证的行为</text>
</svg>