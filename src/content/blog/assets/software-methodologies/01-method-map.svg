<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">20 种开发方法论的分层地图</title>
  <desc id="desc">图中将 20 种开发方法论按项目推进、团队协作、工程实践、质量与验收、软件设计、架构边界和交付运维进行分层，展示它们分别解决的问题。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1d2a35" flood-opacity="0.08"/></filter>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #1d2a35; }
    .muted { fill: #61717d; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 17px; }
    .card-title { font-size: 21px; font-weight: 700; }
    .method { font-size: 16px; }
    .problem { font-size: 15px; }
  </style>
  <rect width="1200" height="720" fill="#f8f7f2"/>
  <text x="60" y="56" class="title">20 种开发方法论，分布在研发链路的不同位置</text>
  <text x="60" y="88" class="subtitle muted">它们不是一张排行榜，而是在回应不同阶段的失控。</text>

  <g filter="url(#shadow)">
    <rect x="60" y="128" width="340" height="132" rx="20" fill="#ffffff" stroke="#b9cfe6" stroke-width="2"/>
    <rect x="430" y="128" width="340" height="132" rx="20" fill="#ffffff" stroke="#b8d7cb" stroke-width="2"/>
    <rect x="800" y="128" width="340" height="132" rx="20" fill="#ffffff" stroke="#e4c7b5" stroke-width="2"/>
    <rect x="60" y="286" width="340" height="132" rx="20" fill="#ffffff" stroke="#d8c6e8" stroke-width="2"/>
    <rect x="430" y="286" width="340" height="132" rx="20" fill="#ffffff" stroke="#e4c7b5" stroke-width="2"/>
    <rect x="800" y="286" width="340" height="132" rx="20" fill="#ffffff" stroke="#b9cfe6" stroke-width="2"/>
    <rect x="60" y="444" width="1080" height="132" rx="20" fill="#ffffff" stroke="#b8d7cb" stroke-width="2"/>
  </g>

  <g>
    <rect x="84" y="150" width="126" height="30" rx="15" fill="#e0ebf8"/>
    <text x="147" y="171" text-anchor="middle" font-size="15" font-weight="700" fill="#35658f">项目推进</text>
    <text x="84" y="212" class="card-title">Waterfall · V-Model · Spiral</text>
    <text x="84" y="240" class="problem muted">项目应该怎样从目标走到交付</text>

    <rect x="454" y="150" width="126" height="30" rx="15" fill="#dcefe8"/>
    <text x="517" y="171" text-anchor="middle" font-size="15" font-weight="700" fill="#347563">团队协作</text>
    <text x="454" y="212" class="card-title">Agile · Scrum · Kanban</text>
    <text x="454" y="240" class="problem muted">团队怎样面对需求和计划变化</text>

    <rect x="824" y="150" width="126" height="30" rx="15" fill="#f6e2d7"/>
    <text x="887" y="171" text-anchor="middle" font-size="15" font-weight="700" fill="#9a4d2c">工程实践</text>
    <text x="824" y="212" class="card-title">XP · Pair Programming</text>
    <text x="824" y="238" class="method">Refactoring</text>
    <text x="824" y="255" class="problem muted">代码怎样保持可修改</text>

    <rect x="84" y="308" width="126" height="30" rx="15" fill="#eadff5"/>
    <text x="147" y="329" text-anchor="middle" font-size="15" font-weight="700" fill="#76529a">质量验收</text>
    <text x="84" y="370" class="card-title">TDD · BDD · ATDD</text>
    <text x="84" y="397" class="method">Specification by Example</text>
    <text x="84" y="414" class="problem muted">怎样尽早确认软件做对了</text>

    <rect x="454" y="308" width="126" height="30" rx="15" fill="#f6e2d7"/>
    <text x="517" y="329" text-anchor="middle" font-size="15" font-weight="700" fill="#9a4d2c">软件设计</text>
    <text x="454" y="370" class="card-title">DDD · MDD</text>
    <text x="454" y="397" class="problem muted">怎样理解业务并组织模型</text>

    <rect x="824" y="308" width="126" height="30" rx="15" fill="#e0ebf8"/>
    <text x="887" y="329" text-anchor="middle" font-size="15" font-weight="700" fill="#35658f">架构边界</text>
    <text x="824" y="370" class="card-title">Clean Architecture</text>
    <text x="824" y="397" class="method">Hexagonal Architecture</text>
    <text x="824" y="414" class="problem muted">怎样隔离业务与外部技术</text>

    <rect x="84" y="466" width="126" height="30" rx="15" fill="#dcefe8"/>
    <text x="147" y="487" text-anchor="middle" font-size="15" font-weight="700" fill="#347563">交付运维</text>
    <text x="84" y="530" class="card-title">DevOps · CI/CD · SRE</text>
    <text x="84" y="558" class="problem muted">怎样稳定地交付、观察和维护系统</text>
    <path d="M390 510 H430" stroke="#61717d" stroke-width="2"/>
    <path d="M760 510 H800" stroke="#61717d" stroke-width="2"/>
    <text x="600" y="625" text-anchor="middle" class="subtitle muted">先定位问题，再选择方法；不同层级的方法可以组合，但不能互相替代。</text>
  </g>
</svg>