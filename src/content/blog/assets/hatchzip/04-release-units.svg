<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
  <title>不同归档格式的释放单位</title>
  <desc>按格式展示 ZIP 条目、7z 固实块、tar 条目和连续压缩流的释放粒度。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3f4b5b"/></marker></defs>
  <rect width="900" height="470" fill="#fff"/>
  <g font-family="sans-serif" fill="#1f2937" font-size="16">
    <text x="450" y="32" text-anchor="middle" font-size="24" font-weight="700">释放单位决定空间边界</text>
    <text x="50" y="82" font-size="19" font-weight="700">ZIP</text>
    <rect x="130" y="55" width="145" height="48" fill="#d8ebff" stroke="#6d9bd2"/><rect x="275" y="55" width="145" height="48" fill="#d8ebff" stroke="#6d9bd2"/><rect x="420" y="55" width="145" height="48" fill="#d8ebff" stroke="#6d9bd2"/><rect x="565" y="55" width="250" height="48" fill="#ffe7c2" stroke="#d69c48"/>
    <text x="202" y="85" text-anchor="middle">条目 A</text><text x="347" y="85" text-anchor="middle">条目 B</text><text x="492" y="85" text-anchor="middle">条目 C</text><text x="690" y="85" text-anchor="middle">目录与结尾记录</text>
    <line x1="750" y1="125" x2="490" y2="125" stroke="#3f4b5b" stroke-width="2" marker-end="url(#arrow)"/><text x="760" y="130">从尾部向前</text>
    <text x="50" y="184" font-size="19" font-weight="700">7z</text>
    <rect x="130" y="157" width="210" height="48" fill="#e8dcff" stroke="#9574c2"/><rect x="340" y="157" width="210" height="48" fill="#e8dcff" stroke="#9574c2"/><rect x="550" y="157" width="265" height="48" fill="#ffe7c2" stroke="#d69c48"/>
    <text x="235" y="187" text-anchor="middle">solid block 1</text><text x="445" y="187" text-anchor="middle">solid block 2</text><text x="680" y="187" text-anchor="middle">尾部 header</text>
    <text x="50" y="286" font-size="19" font-weight="700">tar / RAR</text>
    <rect x="130" y="259" width="165" height="48" fill="#dff3e5" stroke="#72ad83"/><rect x="295" y="259" width="165" height="48" fill="#dff3e5" stroke="#72ad83"/><rect x="460" y="259" width="165" height="48" fill="#dff3e5" stroke="#72ad83"/><rect x="625" y="259" width="190" height="48" fill="#f0f2f5" stroke="#a4adb9"/>
    <text x="212" y="289" text-anchor="middle">文件条目 A</text><text x="377" y="289" text-anchor="middle">文件条目 B</text><text x="542" y="289" text-anchor="middle">文件条目 C</text><text x="720" y="289" text-anchor="middle">尾部 / 卷边界</text>
    <text x="50" y="389" font-size="19" font-weight="700">.tar.gz / .tar.xz</text>
    <rect x="180" y="362" width="590" height="48" fill="#f9d9d7" stroke="#c67c78"/><text x="475" y="392" text-anchor="middle">连续压缩流：通常从开头顺序解码</text>
    <text x="450" y="448" text-anchor="middle" fill="#64748b">块越大，单次提交等待越久；流越连续，越依赖重启点和打洞</text>
  </g>
</svg>
