<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470">
  <title>journal 崩溃恢复顺序</title>
  <desc>按写入、flush、journal、截短四个阶段展示崩溃后如何回到最近安全位置。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3f4b5b"/></marker></defs>
  <rect width="900" height="470" fill="#fff"/>
  <g font-family="sans-serif" fill="#1f2937" text-anchor="middle">
    <text x="450" y="32" font-size="24" font-weight="700">断电后的恢复位置</text>
    <g font-size="16">
      <rect x="35" y="80" width="190" height="210" rx="10" fill="#fff6f5" stroke="#d79b97" stroke-width="2"/><text x="130" y="112" font-size="18" font-weight="700">写入中断</text><circle cx="130" cy="154" r="24" fill="#f9d9d7"/><text x="130" y="160" font-size="20">×</text><text x="130" y="210">归档未截短</text><text x="130" y="239">删除半成品</text><text x="130" y="265">重新处理本批</text>
      <rect x="245" y="80" width="190" height="210" rx="10" fill="#f8fbff" stroke="#a7bdd8" stroke-width="2"/><text x="340" y="112" font-size="18" font-weight="700">flush 后</text><circle cx="340" cy="154" r="24" fill="#d8ebff"/><text x="340" y="160" font-size="20">?</text><text x="340" y="210">journal 仍是旧点</text><text x="340" y="239">回退到旧位置</text><text x="340" y="265">输入仍可重读</text>
      <rect x="455" y="80" width="190" height="210" rx="10" fill="#fffaf1" stroke="#d9b26e" stroke-width="2"/><text x="550" y="112" font-size="18" font-weight="700">journal 后</text><circle cx="550" cy="154" r="24" fill="#ffe7c2"/><text x="550" y="160" font-size="20">✓</text><text x="550" y="210">提交位置已持久化</text><text x="550" y="239">补做归档截短</text><text x="550" y="265">继续下一批</text>
      <rect x="665" y="80" width="200" height="210" rx="10" fill="#f4fbf7" stroke="#8ac7a0" stroke-width="2"/><text x="765" y="112" font-size="18" font-weight="700">截短完成</text><circle cx="765" cy="154" r="24" fill="#e2f4e8"/><text x="765" y="160" font-size="20">✓</text><text x="765" y="210">输入与 journal 一致</text><text x="765" y="239">跳过已提交 unit</text><text x="765" y="265">处理后续内容</text>
    </g>
    <line x1="225" y1="185" x2="245" y2="185" stroke="#3f4b5b" stroke-width="2" marker-end="url(#arrow)"/><line x1="435" y1="185" x2="455" y2="185" stroke="#3f4b5b" stroke-width="2" marker-end="url(#arrow)"/><line x1="645" y1="185" x2="665" y2="185" stroke="#3f4b5b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="450" y="355" font-size="18" fill="#567a62">不变量：journal 不先声明，归档就不先释放</text>
    <text x="450" y="389" font-size="16" fill="#64748b">大文件分段时，恢复点还包括输出长度、解码位点和 CRC</text>
    <text x="450" y="420" font-size="16" fill="#64748b">这是设计文档描述的恢复顺序，不是对所有硬件故障的保证</text>
  </g>
</svg>
