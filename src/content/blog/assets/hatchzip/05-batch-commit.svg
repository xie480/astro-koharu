<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560">
  <title>HatchZip 批次提交顺序</title>
  <desc>流程从选择 unit 到临时输出、校验、flush、journal、截短归档，再进入下一批。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3f4b5b"/></marker></defs>
  <rect width="900" height="560" fill="#fff"/>
  <g font-family="sans-serif" fill="#1f2937" text-anchor="middle">
    <text x="450" y="32" font-size="24" font-weight="700">一个批次的安全提交</text>
    <rect x="300" y="60" width="300" height="48" rx="10" fill="#e2f4e8" stroke="#72ad83"/><text x="450" y="91" font-size="18">1 选择尚未提交的 unit</text>
    <line x1="450" y1="108" x2="450" y2="138" stroke="#3f4b5b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="138" width="300" height="48" rx="10" fill="#d8ebff" stroke="#6d9bd2"/><text x="450" y="169" font-size="18">2 写入临时 part 文件</text>
    <line x1="450" y1="186" x2="450" y2="216" stroke="#3f4b5b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="216" width="300" height="48" rx="10" fill="#d8ebff" stroke="#6d9bd2"/><text x="450" y="247" font-size="18">3 CRC 与大小校验</text>
    <line x1="450" y1="264" x2="450" y2="294" stroke="#3f4b5b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="294" width="300" height="48" rx="10" fill="#d8ebff" stroke="#6d9bd2"/><text x="450" y="325" font-size="18">4 flush 到物理磁盘</text>
    <line x1="450" y1="342" x2="450" y2="372" stroke="#3f4b5b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="372" width="300" height="48" rx="10" fill="#ffe7c2" stroke="#d69c48"/><text x="450" y="403" font-size="18">5 journal 写入 committed_len</text>
    <line x1="450" y1="420" x2="450" y2="450" stroke="#3f4b5b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="300" y="450" width="300" height="48" rx="10" fill="#ffe7c2" stroke="#d69c48"/><text x="450" y="481" font-size="18">6 截短归档，释放空间</text>
    <path d="M600 474 C760 474 760 104 600 84" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="744" y="284" font-size="16" fill="#567a62">继续下一批</text>
    <text x="120" y="288" font-size="17" fill="#b55450">安全边界</text><text x="120" y="314" font-size="15" fill="#64748b">输出可靠后</text><text x="120" y="336" font-size="15" fill="#64748b">输入才会消失</text>
  </g>
</svg>
