<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540">
  <title>HatchZip 适用边界判断流程</title>
  <desc>流程先判断是否能接受归档被消耗，再判断普通解压是否放得下，最后决定是否使用 HatchZip。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3f4b5b"/></marker></defs>
  <rect width="900" height="540" fill="#fff"/>
  <g font-family="sans-serif" fill="#1f2937" text-anchor="middle">
    <text x="450" y="32" font-size="24" font-weight="700">先判断归档价值，再判断空间</text>
    <rect x="280" y="65" width="340" height="58" rx="12" fill="#ffe7c2" stroke="#d69c48"/><text x="450" y="101" font-size="19">能接受归档被消耗吗？</text>
    <line x1="360" y1="123" x2="210" y2="190" stroke="#3f4b5b" stroke-width="2" marker-end="url(#arrow)"/><line x1="540" y1="123" x2="690" y2="190" stroke="#3f4b5b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="280" y="158" font-size="15">否</text><text x="620" y="158" font-size="15">是</text>
    <rect x="70" y="190" width="280" height="58" rx="12" fill="#f0f2f5" stroke="#a4adb9"/><text x="210" y="226" font-size="18">保留唯一备份</text>
    <rect x="550" y="190" width="280" height="58" rx="12" fill="#d8ebff" stroke="#6d9bd2"/><text x="690" y="226" font-size="18">普通解压放得下吗？</text>
    <line x1="690" y1="248" x2="690" y2="300" stroke="#3f4b5b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="550" y="300" width="280" height="58" rx="12" fill="#f0f2f5" stroke="#a4adb9"/><text x="690" y="336" font-size="18">可以：优先普通解压</text>
    <line x1="550" y1="329" x2="430" y2="406" stroke="#3f4b5b" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="370" font-size="15">不可以</text>
    <rect x="270" y="406" width="360" height="62" rx="12" fill="#e2f4e8" stroke="#72ad83"/><text x="450" y="444" font-size="19">检查格式与文件系统后考虑 HatchZip</text>
    <text x="210" y="288" font-size="16" fill="#b55450">普通解压</text><text x="210" y="316" font-size="15" fill="#64748b">或先取得另一份副本</text>
    <text x="450" y="505" font-size="15" fill="#64748b">hatchzip check 先看空间；--keep-archive 保留归档；--verify-first 先验证</text>
  </g>
</svg>
