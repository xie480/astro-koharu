<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">AI生成代码的速度与人类理解速度之间的落差</title>
  <desc id="desc">左侧展示AI快速生成大量代码，右侧展示开发者需要花时间理解需求、上下文和风险，说明代码生成速度提升并不等于Review变简单。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1d2a35" flood-opacity="0.08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#61717d"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#f8f7f2"/>
  <text x="60" y="56" fill="#1d2a35" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700">AI生成代码更快，Review没有同步变简单</text>
  <text x="60" y="86" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17">生产速度和理解速度之间，出现了新的错位。</text>

  <rect x="60" y="130" width="470" height="420" rx="22" fill="#fff" stroke="#b8d7cb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="670" y="130" width="470" height="420" rx="22" fill="#fff" stroke="#e4c7b5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="88" y="158" width="150" height="34" rx="17" fill="#dcefe8"/>
  <text x="163" y="182" text-anchor="middle" fill="#347563" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700">AI生成</text>
  <text x="88" y="232" fill="#1d2a35" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700">很快写出一大段代码</text>
  <text x="88" y="264" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">实现、补全、重构都可以在短时间内完成。</text>
  <g font-family="Consolas, monospace" font-size="15" fill="#1d2a35">
    <rect x="92" y="302" width="406" height="38" rx="8" fill="#eff8f4"/><text x="110" y="327">function buildContext(input) {</text>
    <rect x="92" y="350" width="330" height="38" rx="8" fill="#eff8f4"/><text x="110" y="375">  const state = load(input);</text>
    <rect x="92" y="398" width="370" height="38" rx="8" fill="#eff8f4"/><text x="110" y="423">  return execute(state);</text>
    <rect x="92" y="446" width="250" height="38" rx="8" fill="#eff8f4"/><text x="110" y="471">}</text>
  </g>
  <text x="88" y="520" fill="#347563" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">生成速度 ↑</text>

  <rect x="698" y="158" width="150" height="34" rx="17" fill="#f6e2d7"/>
  <text x="773" y="182" text-anchor="middle" fill="#9a4d2c" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" font-weight="700">人类Review</text>
  <text x="698" y="232" fill="#1d2a35" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="25" font-weight="700">重新补齐代码背后的问题</text>
  <text x="698" y="264" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">需求、状态、边界、依赖和风险都需要重新确认。</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17">
    <rect x="700" y="302" width="406" height="42" rx="9" fill="#fff7f1" stroke="#eed8ca"/><text x="720" y="329" fill="#1d2a35">这段代码对应哪个需求？</text>
    <rect x="700" y="356" width="406" height="42" rx="9" fill="#fff7f1" stroke="#eed8ca"/><text x="720" y="383" fill="#1d2a35">它假设了哪些输入条件？</text>
    <rect x="700" y="410" width="406" height="42" rx="9" fill="#fff7f1" stroke="#eed8ca"/><text x="720" y="437" fill="#1d2a35">异常路径和跨模块影响在哪里？</text>
    <rect x="700" y="464" width="406" height="42" rx="9" fill="#fff7f1" stroke="#eed8ca"/><text x="720" y="491" fill="#1d2a35">实现是否符合原本的设计意图？</text>
  </g>
  <text x="698" y="540" fill="#9a4d2c" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">理解与判断成本 ↑</text>

  <path d="M530 342 H670" stroke="#61717d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="318" text-anchor="middle" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">速度错位</text>
  <text x="600" y="367" text-anchor="middle" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">代码变多，理解没有自动变快</text>
</svg>