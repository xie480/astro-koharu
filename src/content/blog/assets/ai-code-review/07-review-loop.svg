<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">从需求到代码，再回到测试反馈</title>
  <desc id="desc">环形流程图展示需求、建模、测试、AI实现、执行验证和人类Review之间的反馈闭环。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#61717d"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#f8f7f2"/>
  <text x="60" y="56" fill="#1d2a35" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700">从需求到代码，再回到测试反馈</text>
  <text x="60" y="86" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17">AI编程更像一个持续反馈的工程闭环，而不是一次性生成。</text>

  <circle cx="600" cy="350" r="190" fill="#fff" stroke="#d7dee2" stroke-width="2"/>
  <circle cx="600" cy="350" r="86" fill="#fef9e7" stroke="#c39b37" stroke-width="2"/>
  <text x="600" y="340" text-anchor="middle" fill="#8b6e1f" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700">人类判断</text>
  <text x="600" y="370" text-anchor="middle" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">设计、边界、风险</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17">
    <rect x="498" y="110" width="204" height="58" rx="29" fill="#dcefe8"/><text x="600" y="146" text-anchor="middle" fill="#347563" font-weight="700">1. 需求</text>
    <rect x="835" y="218" width="204" height="58" rx="29" fill="#e8f0fe"/><text x="937" y="254" text-anchor="middle" fill="#416b91" font-weight="700">2. 设计模型</text>
    <rect x="835" y="424" width="204" height="58" rx="29" fill="#eee9f8"/><text x="937" y="460" text-anchor="middle" fill="#6d5a90" font-weight="700">3. 测试条件</text>
    <rect x="498" y="532" width="204" height="58" rx="29" fill="#f6e2d7"/><text x="600" y="568" text-anchor="middle" fill="#9a4d2c" font-weight="700">4. AI实现</text>
    <rect x="161" y="424" width="204" height="58" rx="29" fill="#fff7f1" stroke="#eed8ca"/><text x="263" y="460" text-anchor="middle" fill="#9a4d2c" font-weight="700">5. 执行验证</text>
    <rect x="161" y="218" width="204" height="58" rx="29" fill="#fef9e7" stroke="#e6d49b"/><text x="263" y="254" text-anchor="middle" fill="#8b6e1f" font-weight="700">6. Review</text>
  </g>

  <path d="M702 140 C800 148 850 174 900 218" fill="none" stroke="#61717d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M980 276 C1040 324 1040 378 980 424" fill="none" stroke="#61717d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M835 482 C780 530 738 548 702 556" fill="none" stroke="#61717d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M498 556 C420 548 354 520 365 482" fill="none" stroke="#61717d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M263 424 C170 380 170 320 220 276" fill="none" stroke="#61717d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M365 218 C420 174 454 150 498 140" fill="none" stroke="#61717d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="600" y="620" text-anchor="middle" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">测试失败回到实现，设计问题回到需求和模型</text>
</svg>