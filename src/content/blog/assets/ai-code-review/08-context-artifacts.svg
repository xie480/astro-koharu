<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">上下文一旦靠复制，闭环很快会断</title>
  <desc id="desc">左右对比复制上下文的混乱流程和带有版本、来源、关联关系的可追踪设计产物链。</desc>
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#9a4d2c"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#347563"/></marker>
  </defs>
  <rect width="1200" height="660" fill="#f8f7f2"/>
  <text x="60" y="56" fill="#1d2a35" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700">上下文一旦靠复制，闭环很快会断</text>
  <text x="60" y="86" fill="#61717d" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17">需求、模型、测试和代码需要成为一组可以追踪的设计产物。</text>

  <rect x="60" y="124" width="500" height="450" rx="20" fill="#fff" stroke="#e4c7b5" stroke-width="2"/>
  <rect x="640" y="124" width="500" height="450" rx="20" fill="#fff" stroke="#b8d7cb" stroke-width="2"/>
  <text x="92" y="166" fill="#9a4d2c" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700">复制式流程</text>
  <text x="672" y="166" fill="#347563" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700">可追踪产物链</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">
    <rect x="92" y="204" width="190" height="48" rx="10" fill="#f6e2d7"/><text x="187" y="234" text-anchor="middle" fill="#1d2a35">需求文档</text>
    <rect x="338" y="204" width="190" height="48" rx="10" fill="#fff7f1" stroke="#eed8ca"/><text x="433" y="234" text-anchor="middle" fill="#1d2a35">AI对话</text>
    <path d="M282 228 H338" stroke="#9a4d2c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
    <rect x="92" y="294" width="190" height="48" rx="10" fill="#f6e2d7"/><text x="187" y="324" text-anchor="middle" fill="#1d2a35">代码</text>
    <rect x="338" y="294" width="190" height="48" rx="10" fill="#fff7f1" stroke="#eed8ca"/><text x="433" y="324" text-anchor="middle" fill="#1d2a35">测试</text>
    <path d="M282 318 H338" stroke="#9a4d2c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
    <rect x="92" y="384" width="190" height="48" rx="10" fill="#f6e2d7"/><text x="187" y="414" text-anchor="middle" fill="#1d2a35">修改后的需求</text>
    <rect x="338" y="384" width="190" height="48" rx="10" fill="#fff7f1" stroke="#eed8ca"/><text x="433" y="414" text-anchor="middle" fill="#1d2a35">旧测试 / 旧代码</text>
    <path d="M187 342 V384" stroke="#9a4d2c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
    <path d="M433 342 V384" stroke="#9a4d2c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-red)"/>
  </g>
  <text x="310" y="506" text-anchor="middle" fill="#9a4d2c" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700">版本漂移、上下文丢失、责任难以回溯</text>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">
    <rect x="672" y="204" width="436" height="48" rx="10" fill="#dcefe8"/><text x="694" y="234" fill="#1d2a35">需求 v3 · 来源与变更记录</text>
    <path d="M890 252 V270" stroke="#347563" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <rect x="672" y="286" width="436" height="48" rx="10" fill="#e8f0fe"/><text x="694" y="316" fill="#1d2a35">设计模型 v2 · 状态与职责</text>
    <path d="M890 334 V352" stroke="#347563" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <rect x="672" y="368" width="436" height="48" rx="10" fill="#eee9f8"/><text x="694" y="398" fill="#1d2a35">测试集 v2 · 验收条件与边界</text>
    <path d="M890 416 V434" stroke="#347563" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <rect x="672" y="450" width="436" height="48" rx="10" fill="#f6e2d7"/><text x="694" y="480" fill="#1d2a35">代码 v5 · 测试结果与Review记录</text>
  </g>
  <text x="890" y="536" text-anchor="middle" fill="#347563" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700">每个产物都能回到来源，也能找到下游影响</text>
</svg>