<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">固定注入与做梦式记忆的差异</title>
  <desc id="desc">左侧展示由人类维护并在每次会话中完整加载的固定记忆，右侧展示由 Agent 在任务之间回放、验证、整理并按需注入的做梦式记忆。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1d2a35" flood-opacity="0.08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#61717d"/></marker>
  </defs>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #1d2a35; }
    .muted { fill: #61717d; }
    .orange { fill: #9a4d2c; }
    .green { fill: #347563; }
    .small { font-size: 15px; }
    .label { font-size: 18px; font-weight: 700; }
  </style>

  <rect width="1200" height="640" fill="#f8f7f2"/>
  <text x="60" y="56" font-size="30" font-weight="700">固定注入和做梦式记忆，差别不只是有没有一个文件</text>
  <text x="60" y="88" class="muted" font-size="17">前者提前决定什么重要，后者让 Agent 在任务之后重新判断。</text>

  <rect x="60" y="128" width="500" height="430" rx="22" fill="#ffffff" stroke="#e4c7b5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="640" y="128" width="500" height="430" rx="22" fill="#ffffff" stroke="#b8d7cb" stroke-width="2" filter="url(#shadow)"/>

  <rect x="90" y="158" width="150" height="34" rx="17" fill="#f6e2d7"/>
  <text x="165" y="182" text-anchor="middle" class="orange label">固定注入</text>
  <text x="90" y="224" font-size="24" font-weight="700">人类先写好</text>
  <text x="90" y="252" class="muted small">每次会话都加载同一份记忆。</text>

  <g>
    <rect x="90" y="288" width="440" height="46" rx="11" fill="#fff7f1" stroke="#eed8ca"/>
    <text x="112" y="318" class="label">人类维护 MEMORY.md</text>
    <path d="M310 334 V350" stroke="#d6a98d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="90" y="354" width="440" height="46" rx="11" fill="#fff7f1" stroke="#eed8ca"/>
    <text x="112" y="384" class="label">每轮加载全部内容</text>
    <path d="M310 400 V416" stroke="#d6a98d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="90" y="420" width="440" height="46" rx="11" fill="#fff7f1" stroke="#eed8ca"/>
    <text x="112" y="450" class="label">过期信息持续出现</text>
  </g>
  <text x="90" y="510" class="orange" font-size="17" font-weight="700">维护成本 ↑　上下文噪声 ↑</text>

  <rect x="670" y="158" width="150" height="34" rx="17" fill="#dcefe8"/>
  <text x="745" y="182" text-anchor="middle" class="green label">做梦式维护</text>
  <text x="670" y="224" font-size="24" font-weight="700">Agent 任务后再整理</text>
  <text x="670" y="252" class="muted small">原始轨迹保留，记忆按需更新。</text>

  <g>
    <rect x="670" y="288" width="440" height="46" rx="11" fill="#f2fbf7" stroke="#cfe7dc"/>
    <text x="692" y="318" class="label">回放 transcript 和旧记忆</text>
    <path d="M890 334 V350" stroke="#91c2ad" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="670" y="354" width="440" height="46" rx="11" fill="#f2fbf7" stroke="#cfe7dc"/>
    <text x="692" y="384" class="label">验证、合并、纠错、降级</text>
    <path d="M890 400 V416" stroke="#91c2ad" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="670" y="420" width="440" height="46" rx="11" fill="#f2fbf7" stroke="#cfe7dc"/>
    <text x="692" y="450" class="label">小入口 + 下层按需搜索</text>
  </g>
  <text x="670" y="510" class="green" font-size="17" font-weight="700">记忆质量 ↑　注入噪声 ↓</text>

  <path d="M560 342 H640" stroke="#61717d" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="322" text-anchor="middle" class="muted small">转变</text>
  <text x="600" y="365" text-anchor="middle" class="muted small">从喂养到维护</text>

  <rect x="272" y="580" width="656" height="38" rx="19" fill="#eef3f4"/>
  <text x="600" y="605" text-anchor="middle" class="muted" font-size="16">人类定义目标、权限和边界；Agent 判断具体经验的显著性。</text>
</svg>